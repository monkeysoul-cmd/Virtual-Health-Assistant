name: CI Pipeline

on:
  push:
    branches: [main, master, crashing-solved]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Backend Test Suite
        run: node backend/test/api.test.js
        env:
          PORT: 5001
          NODE_ENV: test

      - name: Build Next.js Production Bundle
        run: npm run build
